[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "ultimate-tic-tac-toe-ai"
version = "0.1.0"
description = "An AI agent for Ultimate Tic Tac Toe using Monte Carlo Tree Search (MCTS)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "flask-cors>=5.0.0",
    "flask>=3.1.0",
    "invoke>=2.2.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[tool.maturin]
manifest-path = "rust_mcts/Cargo.toml"
